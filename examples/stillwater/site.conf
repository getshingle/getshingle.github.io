# ==============================================================================
# site.conf: the settings for your website.
# Change the text between the "double quotes". Save, then run: bash build.sh
# No spaces around the = sign: NAME="text" works, NAME = "text" does not.
# ==============================================================================

# --- Your website --------------------------------------------------------------
SITE_NAME="Stillwater Yoga"
SITE_DESCRIPTION="A small yoga studio by the river, with classes for every body from early morning to late evening."
SITE_URL="https://example.com"        # your web address, without / at the end
SITE_LANG="en"                        # the language of your pages: en, de, sl …

# --- Contact: shown at the bottom of every page --------------------------------
# In a page you can write {{EMAIL}}, {{PHONE}} or {{ADDRESS}}.
EMAIL="hello@example.com"             # spam bots cannot read it on the page
PHONE="+1 555 0163"
ADDRESS="27 River Walk, Riverton"

# --- Menu: one line per link, "Text|/address/" ---------------------------------
MENU=(
  "Classes|/services/"
  "Schedule|/schedule/"
  "Prices|/pricing/"
  "Teachers|/team/"
  "Contact|/contact/"
)
MENU_BUTTON="Try a class for free|/contact/#trial"   # the button at the end of the menu; "" for none

# --- Bottom of every page --------------------------------------------------------
FOOTER_TEXT="A small studio with big windows over the river. Classes for every body, every day of the week."

# Social networks: "network|link". Networks: linkedin, x, facebook, instagram,
# bluesky, threads, youtube, github, tiktok, mastodon, pinterest, behance,
# whatsapp, website.
SOCIAL=(
  "instagram|https://www.instagram.com/"
  "youtube|https://www.youtube.com/"
  "whatsapp|https://wa.me/15550163"
)

# Small links at the very bottom, such as a privacy policy: "Text|/address/".
LEGAL=(
  "Questions|/faq/"
)

# --- Look --------------------------------------------------------------------------
THEME="mint"                          # colors and fonts: a folder in themes/

# --- Links -------------------------------------------------------------------------
# "files": the pages in dist/ open with a double click on your computer, and
#          work online too. Keep this if you are not sure.
# "web":   shorter addresses (/about/ instead of about/index.html). Then open
#          the website through a small web server, for example:
#          python3 -m http.server -d dist 8080   and go to http://localhost:8080
LINKS="files"
