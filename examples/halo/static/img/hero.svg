<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 70 1100 800">
  <title>A website in a browser window, with a speed score of 100</title>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b0b0d" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect x="50" y="70" width="1100" height="800" fill="#f4f4f6"/>

  <!-- browser window -->
  <rect x="90" y="110" width="1020" height="660" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <path d="M90 128a18 18 0 0 1 18-18h984a18 18 0 0 1 18 18v34H90z" fill="#ececf0"/>
  <g fill="#d2d2d9"><circle cx="124" cy="136" r="7"/><circle cx="148" cy="136" r="7"/><circle cx="172" cy="136" r="7"/></g>
  <rect x="400" y="123" width="400" height="26" rx="13" fill="#ffffff"/>
  <text x="600" y="141" fill="#62626c" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">halo-studio.example</text>

  <!-- page: navigation -->
  <circle cx="152" cy="206" r="11" fill="none" stroke="#0b0b0d" stroke-width="4"/>
  <rect x="174" y="200" width="86" height="12" rx="6" fill="#0b0b0d"/>
  <g fill="#cfcfd6"><rect x="640" y="201" width="56" height="10" rx="5"/><rect x="716" y="201" width="56" height="10" rx="5"/><rect x="792" y="201" width="56" height="10" rx="5"/></g>
  <rect x="900" y="190" width="160" height="32" rx="16" fill="#5b3df5"/>

  <!-- page: headline, text, buttons -->
  <rect x="140" y="282" width="500" height="40" rx="8" fill="#0b0b0d"/>
  <rect x="140" y="336" width="390" height="40" rx="8" fill="#0b0b0d"/>
  <g fill="#cfcfd6"><rect x="140" y="406" width="460" height="12" rx="6"/><rect x="140" y="430" width="400" height="12" rx="6"/></g>
  <rect x="140" y="472" width="150" height="44" rx="22" fill="#5b3df5"/>
  <rect x="304" y="473" width="130" height="42" rx="21" fill="none" stroke="#cfcfd6" stroke-width="2"/>

  <!-- page: picture -->
  <rect x="690" y="270" width="370" height="250" rx="14" fill="#ece8ff"/>
  <circle cx="875" cy="395" r="72" fill="none" stroke="#5b3df5" stroke-width="16"/>
  <circle cx="875" cy="395" r="22" fill="#5b3df5" opacity=".35"/>

  <!-- page: three cards -->
  <g fill="#f4f4f6"><rect x="140" y="570" width="280" height="160" rx="12"/><rect x="460" y="570" width="280" height="160" rx="12"/></g>
  <g fill="#cfcfd6"><rect x="166" y="600" width="150" height="14" rx="7"/><rect x="166" y="630" width="210" height="10" rx="5"/><rect x="166" y="650" width="180" height="10" rx="5"/>
    <rect x="486" y="600" width="150" height="14" rx="7"/><rect x="486" y="630" width="210" height="10" rx="5"/><rect x="486" y="650" width="180" height="10" rx="5"/></g>

  <!-- speed score -->
  <rect x="790" y="580" width="300" height="240" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="940" cy="680" r="62" fill="none" stroke="#ece8ff" stroke-width="14"/>
  <circle cx="940" cy="680" r="62" fill="none" stroke="#5b3df5" stroke-width="14"/>
  <text x="940" y="694" fill="#0b0b0d" font-family="system-ui, sans-serif" font-size="40" font-weight="600" text-anchor="middle">100</text>
  <text x="940" y="789" fill="#62626c" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">Performance</text>
</svg>
